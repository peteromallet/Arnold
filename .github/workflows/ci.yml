name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[agent]'
      - name: Validate strategy and rebuild projection
        run: |
          python -m arnold_pipelines.megaplan.cli strategy validate
          rm -f .megaplan/strategy.projection.json
          python -m arnold_pipelines.megaplan.cli strategy project --write
      - name: Check generated Arnold docs
        run: python scripts/generate_arnold_docs.py --check
      - name: Validate Arnold generated examples
        run: python -m pytest tests/docs/test_m5_generated_scans.py -q
      - name: Validate M7 default-off and export regressions
        run: |
          unset MEGAPLAN_M7_SINKS
          MEGAPLAN_MOCK_WORKERS=1 python -m pytest tests/test_chain_epic_briefs_lint.py tests/store/test_capsule_storage.py tests/store/test_warrant_sources.py -q
      - name: Test
        run: python -m pytest tests/characterization/test_import_surface.py tests/test_pipeline_run_cli.py tests/test_chain_done_gate.py tests/arnold/workflow/test_m5_inventory_scanners.py tests/cli/test_m5_workflow_cli.py tests/arnold/conformance -q

  # ──────────────────────────────────────────────────────────────────
  # CL2 admission gate — fail-closed authorization for all CL2 work.
  #
  # Runs the authoritative read-only repository command
  # (``scripts/check_cl2_admission.py``) against the externally supplied,
  # independently reviewed acceptance bundle. It succeeds only when the
  # strict admission gate accepts the bundle and prints the deterministic
  # ``binding_hash``; every CL2 implementation job MUST list this job in
  # its ``needs:`` so that no CL2 work can run without a real, accepted
  # bundle. The binding hash is exported as the ``binding-hash`` job
  # output for downstream CL2 jobs to consume.
  #
  # The accepted bundle is supplied out-of-band as the
  # ``CL2_ADMISSION_BUNDLE_B64`` repository secret: a base64-encoded
  # ``tar.gz`` of a directory containing ``manifest.json`` plus the four
  # declared artifacts. When the secret is absent the job fails closed,
  # so no CL2 job proceeds. Existing non-CL2 WBC jobs are intentionally
  # left unaltered and do not depend on this gate.
  # ──────────────────────────────────────────────────────────────────
  cl2-admission:
    runs-on: ubuntu-latest
    outputs:
      binding-hash: ${{ steps.admit.outputs.binding_hash }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[agent]'
      - name: Materialize externally supplied admission bundle
        env:
          CL2_ADMISSION_BUNDLE_B64: ${{ secrets.CL2_ADMISSION_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${CL2_ADMISSION_BUNDLE_B64:-}" ]; then
            echo "::error::CL2 admission bundle secret CL2_ADMISSION_BUNDLE_B64 is not configured; CL2 work cannot be admitted." >&2
            exit 1
          fi
          mkdir -p .cl2-admission-bundle
          printf '%s' "$CL2_ADMISSION_BUNDLE_B64" | base64 -d | tar -xz -C .cl2-admission-bundle
          # The command opens exactly the manifest and the four declared
          # artifact paths it references; a missing manifest fails closed.
          test -f .cl2-admission-bundle/manifest.json
      - name: Run authoritative CL2 admission command
        id: admit
        run: |
          set -euo pipefail
          # On success the command prints only the 64-char hex binding hash.
          binding_hash="$(python scripts/check_cl2_admission.py .cl2-admission-bundle/manifest.json)"
          test "${#binding_hash}" -eq 64
          echo "binding_hash=${binding_hash}" >> "$GITHUB_OUTPUT"
          echo "Accepted CL2 binding hash: ${binding_hash}"

  docker-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[agent]'
      - name: Run Docker-dependent tests (best-effort)
        continue-on-error: true
        run: python -m pytest -m slow tests/test_cloud_docker_build.py -q

  merge-result-conformance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[agent]' build
      - name: Check generated assets and package disposition
        run: |
          python scripts/generate_arnold_docs.py --check
          python scripts/render_package_disposition_md.py --check
          python scripts/validate_package_disposition.py --summary
          python scripts/check_workflow_pipeline_inventory.py --check-docs
          python scripts/check_pipeline_id_registry.py --no-drift --check-identity-report
      - name: Run merge-result gates
        run: |
          python scripts/m6_purge_gate.py
          python scripts/chain_done_gate.py --blockers-only --blockers docs/arnold/workflow-manifest-runtime-review/blockers.json
      - name: Run installed-artifact smoke tests
        run: python -m pytest -m wheel_smoke tests/installed_wheel tests/arnold_pipelines/megaplan/test_wheel_smoke.py -q
