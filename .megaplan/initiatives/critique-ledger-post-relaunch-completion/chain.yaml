base_branch: main
merge_policy: auto
prerequisite_policy: required
validation_policy: required
review_policy:
  clean_milestone_pr: auto
anchors:
  north_star: NORTHSTAR.md
launch_preconditions:
  - name: safe v3 canary handoff is independently accepted
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: arnold.critique_ledger.safe_v3_canary_completion.v1
  - name: safe v3 canary handoff is committed input
    kind: git_tracked
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
  - name: handoff contains accepted r5 migrated-child receipt
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: arnold.megaplan.r5_vj24_migrated_child_receipt.v1
  - name: r5 parent is immutable and quarantined
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"parent_disposition":"QUARANTINED_IMMUTABLE"'
  - name: same occurrence resume is explicitly prohibited
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"same_occurrence_resume":false'
  - name: continuation is an authority approved child or new attempt
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"continuation_class":"AUTHORITY_APPROVED_MIGRATED_CHILD_OR_NEW_ATTEMPT"'
  - name: selector result and cursor recovery are independently accepted
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"vj24_recovery_decision":"accepted"'
  - name: parent Run Authority journal CAS is accepted
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"parent_ra_journal_cas":"accepted"'
  - name: child lifecycle advance is accepted separately
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"child_lifecycle_advance":"accepted"'
  - name: T6.2 handoff freezes residual CL2 through CL5 work
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"frozen_cl2_cl5_residual_work":"accepted"'
  - name: independent T6.2 decision is accepted
    path: evidence/critique-ledger-recovery/T6.2/safe-v3-canary-acceptance.json
    check:
      kind: contains_text
      text: '"decision":"accepted"'
  - name: independent T6.2 decision accepts migrated lineage
    path: evidence/critique-ledger-recovery/T6.2/safe-v3-canary-acceptance.json
    check:
      kind: contains_text
      text: '"r5_migrated_lineage_decision":"accepted"'
  - name: independent T6.2 decision is committed evidence
    kind: git_tracked
    path: evidence/critique-ledger-recovery/T6.2/safe-v3-canary-acceptance.json
  - name: canary automatic repair effects were fail closed
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"automatic_repair_effects":"DISABLED_FAIL_CLOSED"'
  - name: canary notification effects were fail closed
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"notification_effects":"DISABLED_FAIL_CLOSED"'
  - name: canary recovery capabilities were absent
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"recovery_capability_profile":"ZERO_RECOVERY"'
  - name: poisoned v2 generation was terminally fenced
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/handoff/safe-v3-canary-completion-manifest.json
    check:
      kind: contains_text
      text: '"v2_authority":"TERMINALLY_FENCED"'
  - name: unfinished work custody ledger is committed input
    kind: git_tracked
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/UNFINISHED_WORK.md
  - name: incident-specific control amendment is present
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/evidence/incident-specific-control-amendment-20260804.md
    check:
      kind: contains_text
      text: incident-specific-control-amendment.v1
  - name: incident-specific control amendment is committed input
    kind: git_tracked
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/evidence/incident-specific-control-amendment-20260804.md
  - name: architecture-fit minimality gate is present
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/evidence/architecture-fit-and-minimality-gate-20260804.md
    check:
      kind: contains_text
      text: architecture-fit-minimality-gate.v1
  - name: architecture-fit minimality gate is committed input
    kind: git_tracked
    path: .megaplan/initiatives/critique-ledger-post-relaunch-completion/evidence/architecture-fit-and-minimality-gate-20260804.md
