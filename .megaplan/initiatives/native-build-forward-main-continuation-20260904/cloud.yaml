provider: ssh
repo:
  url: https://github.com/peteromallet/Arnold.git
  branch: main
  # Writable operation/project root. The reviewed source is provisioned
  # separately at /workspace/arnold; the manifest-created runtime candidate
  # is a third, immutable execution root.
  workspace: /workspace/projects/native-build-forward-main-continuation-20260904/Arnold
extra_repos:
  # Clean, non-state-bearing provenance checkout consumed by the canonical
  # supervisor/bootstrap path. It is the same main revision as repo.workspace.
  - url: https://github.com/peteromallet/Arnold.git
    branch: main
    workspace: /workspace/arnold
mode: idle
chain_session: nbf-main-continuation-main-clean2-20260904
chain:
  spec: /workspace/projects/native-build-forward-main-continuation-20260904/Arnold/.megaplan/initiatives/native-build-forward-main-continuation-20260904/chain.yaml
megaplan:
  ref: main
  # Image-provisioned Python 3.11 bootstrap interpreter. Per-epic execution
  # uses the manifest's runtime_root under the operation base's
  # runtime-candidates/ directory instead (with its attested Python 3.13
  # generation interpreter).
  src_path: /workspace/arnold
  codex_auth: chatgpt
  repo: https://github.com/peteromallet/Arnold.git
  runtime_python: /root/.pyenv/versions/3.11.11/bin/python
agents:
  default: omp
ssh:
  host: 159.69.51.216
  user: root
  port: 22
  identity_file: /Users/peteromalley/.ssh/services/agentbox_159_69_51_216_ed25519
  remote_dir: /opt/megaplan-cloud/deploy
  # Unique host workspace is mounted as /workspace in the new container.
  workspace_dir: /opt/megaplan-cloud/workspace/nbf-main-continuation-clean2-20260904
  container: nbf-main-continuation-clean2-20260904
driver:
  babysitter:
    mode: superfixer
secrets: []
