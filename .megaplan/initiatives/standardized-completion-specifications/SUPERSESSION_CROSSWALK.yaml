schema: arnold.completion_supersession_crosswalk.v1
launchable: false
retired_initiative: standardized-completion-specifications
governing_analysis: docs/arnold/completion-spec-sequencing-and-ownership.md
active_native_path: .megaplan/initiatives/megaplan-native-parity-corrective/chain.yaml
active_platform_path: .megaplan/initiatives/native-workflow-platformization/chain.yaml
critical_path:
  - accepted/consolidated Custody M11 plus bounded-projection handoff
  - Native S1
  - amended Native S2F
  - Native C1
  - Native C2 (shadow/non-authoritative)
  - Native S2R GO-0 (sole authoritative kernel enablement)
  - Native S3A through S7
  - Platform S1
  - Platform S2A
  - Platform S2B
  - Platform S3
  - Platform S4
  - Platform S5
  - Platform S6
global_invariants:
  custody_bounded_projection_owner: >-
    Custody owns the incremental/bounded incident projection implementation,
    full-rebuild parity, invalidation behavior, and 57k-scale benchmark
    receipt. Native requires and consumes that exact handoff.
  registry_separation: >-
    Completion candidate outcomes and Platform enforcement dispositions are
    distinct typed registries with a total generated reject-unknown-pairs
    boundary mapping. They are never collapsed into one enum.
  compatibility_boundary: >-
    Internal persisted-wire compatibility begins at accepted Native S2R GO-0.
    Stable public API publication remains Platform S6-only.
  evidence_preservation: >-
    Preserve historical evidence and every artifact consumed by an existing
    manifest or gate. Supersession must never orphan proof.
protected_historical_sources:
  - path: briefs/m1.md
    preservation: byte-for-byte
  - path: briefs/m2.md
    preservation: byte-for-byte
  - path: briefs/m3.md
    preservation: byte-for-byte
  - path: briefs/m4.md
    preservation: byte-for-byte
  - path: briefs/m5.md
    preservation: byte-for-byte
  - path: decisions/standardized-completion-spec-proposal.md
    preservation: byte-for-byte
coverage_summary:
  total_requirements: 83
  by_old_milestone:
    Completion M1: 20
    Completion M2: 20
    Completion M3: 15
    Completion M4: 14
    Completion M5: 12
    Historical constraints/non-goals: 2
  required_fields:
    - id
    - source
    - old_owner
    - new_owners
    - proof_destination
    - preservation
    - status
  allowed_statuses:
    - redistributed
    - corrected_and_redistributed
    - superseded_by_design
