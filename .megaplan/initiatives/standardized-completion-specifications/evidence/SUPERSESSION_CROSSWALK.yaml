    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c2-completion-binding-evaluation-shadow.md
    locator: Required work 5; C2 gate
    rule: >-
      Evaluate one proposed candidate before selecting its applicable
      obligations. Blocked and waived candidates require typed proof.
      Quarantine is nonterminal unless a separately admitted terminal policy
      explicitly permits it.
  COMP-OBLIGATION-IDENTITY:
    owners: [c1-completion-contract-identity-shadow, c2-completion-binding-evaluation-shadow]
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c1-completion-contract-identity-shadow.md
    locator: Required work 3-4; C1 gate
    rule: >-
      Executable obligation identity is (spec_hash, obligation_id);
      obligation_id is stable, never semantically reused, and tombstoned on
      replacement. Verdict/evidence reuse additionally requires the exact
      binding_hash.
  COMP-AGGREGATION-ALGEBRA:
    owners: [c2-completion-binding-evaluation-shadow]
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c2-completion-binding-evaluation-shadow.md
    locator: Required work 4 and 6; C2 gate
    rule: >-
      Generic algebra defines total child-disposition mapping, selected-path
      and complete-child-set inputs, waiver taint, multiplicity, and
      no-double-counting without concrete primitive instances.
  COMP-AGGREGATION-INSTANCES:
    owners: [s2r-durable-control-primitives-custody-binding]
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/s2r-durable-control-primitives-custody-binding.md
    locator: Required work; GO-FORMAT consumption and GO-0; Semantic gate
    rule: >-
      S2R supplies exactly one total concrete child-set and aggregation instance
      for every supported durable primitive before the sole GO-0 enablement.
  COMP-PRESENCE-ABSENCE-CAPTURE:
    owners: [c2-completion-binding-evaluation-shadow]
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c2-completion-binding-evaluation-shadow.md
    locator: Required work 4; C2 gate
    rule: >-
      Presence, complete-capture absence, and exact-set verification are
      distinct; absence/set equality cannot succeed without named complete
      capture and return unknown when capture is incomplete.
  COMP-EVIDENCE-WINDOW:
    owners: [c2-completion-binding-evaluation-shadow]
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c2-completion-binding-evaluation-shadow.md
    locator: Required work 2-3; C2 gate
    rule: >-
      The normative evidence-window tuple binds subject/path/occurrence,
      attempt/generation, dependency/child set, source/tree/runtime and
      installed digests, component/graph/policy assets, store
      incarnation/restore generation, per-store cursor range/vector, Run
      Authority fence, Custody target/epoch, WBC version, admission receipt,
      and product-contract digest.
  COMP-VERIFIER-INDEPENDENCE:
    owners: [c2-completion-binding-evaluation-shadow]
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c2-completion-binding-evaluation-shadow.md
    locator: Required work 7; C2 gate
    rule: >-
      Independence is enforced by implementation/code provenance, producer
      identity, trust/authority class, and direct primary-evidence access.
  COMP-CANONICAL-DISPOSITIONS:
    owners:
      - c1-completion-contract-identity-shadow
      - s1-component-standard-extraction-inventory
      - s2a-enforced-composition-resolution-package-surface
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c1-completion-contract-identity-shadow.md
    locator: Required work 7; C1 gate
    supporting_path: .megaplan/initiatives/native-workflow-platformization/briefs/s2a-enforced-composition-resolution-package-surface.md
    rule: >-
      There is one canonical completion candidate-outcome registry; all
      product completion registries are strict tested projections. The
      platform enforcement-disposition registry is a separate semantic axis,
      also canonical rather than copied, and interaction uses one total
      generated reject-unknown-pairs mapping.
  COMP-NEUTRAL-IMPORT-BOUNDARY:
    owners:
      - c1-completion-contract-identity-shadow
      - s4-isolated-extraction-recomposition
      - s5-adversarial-second-consumer-substitutability
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c1-completion-contract-identity-shadow.md
    locator: Required work 1-2; C1 gate
    rule: >-
      Neutral kernel types import neither Megaplan nor Arnold product policy;
      adapters remain product-side and cumulative import lint is reconsumed by
      Native S7 and Platform S4/S5.
  COMP-DEFERRED-SUBJECT-TEMPLATES:
    owners:
      - s2f-pype-compiler-identity-converter
      - c1-completion-contract-identity-shadow
      - s2r-durable-control-primitives-custody-binding
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/s2f-pype-compiler-identity-converter.md
    locator: Required work 10; GO-FORMAT gate
    rule: >-
      Human-gate and rework subject identities exist by S2F or are represented
      by an explicit source-stable deferred call-site template; omission or
      ungated runtime identity creation rejects before C1/S2R.
  COMP-Q49-BOUNDED-REPLAY:
    owners: [s5b-live-delivery-cutover-review-rework]
    upstream_owner: m11-conformance-and-legacy-retirement
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/s5b-live-delivery-cutover-review-rework.md
    locator: Mandatory GO-2 consumption; Custody-adoption gate
    dependency_path: .megaplan/initiatives/custody-control-plane/bounded-incident-projection-handoff.json
    rule: >-
      Custody owns the cursor-bounded implementation/full-rebuild parity and
      57k receipt; S5B must enforce latency, peak-memory, invalidation, and
      no-full-history-fallback before live cutover.
  COMP-RESTORE-INCARNATION:
    owners:
      - c2-completion-binding-evaluation-shadow
      - s2r-durable-control-primitives-custody-binding
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c2-completion-binding-evaluation-shadow.md
    locator: Required work 2-3 and 12; C2 gate
    rule: >-
      The introduction-time restore drill mutates store incarnation and restore
      generation, rejects stale receipts/evidence, and replays from the bound
      raw-history high-water cursor before first authority.
  COMP-DIVERGENCE-OCCURRENCE:
    owners: [c1-completion-contract-identity-shadow]
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c1-completion-contract-identity-shadow.md
    locator: Required work 10-12; C1 gate
    rule: >-
      Every parity divergence reuses the stable finding/occurrence system;
      narrowing evidence updates the same occurrence in the content-addressed
      ledger rather than changing blocker identity.
  COMP-PROJECTION-DELETION:
    owners: [c2-completion-binding-evaluation-shadow]
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c2-completion-binding-evaluation-shadow.md
    locator: Required work 13; C2 gate
    rule: >-
      Markdown/status reports are disposable non-authoritative projections;
      deletion/rebuild and forgery/corruption fixtures preserve canonical
      decision, verdict, effect identity, and perform no new action.
  COMP-BINDING-WIRE-VERSION:
    owners:
      - c1-completion-contract-identity-shadow
      - c2-completion-binding-evaluation-shadow
      - s2r-durable-control-primitives-custody-binding
      - s6-certification-evolution-adoption
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c1-completion-contract-identity-shadow.md
    locator: Required work 3; C1 gate
    supporting_path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c2-completion-binding-evaluation-shadow.md
    rule: >-
      The persisted binding schema is internally versioned at C1, its
      reader/writer and decoder matrix is completed at C2, its enforceable
      compatibility promise begins at accepted S2R GO-0, and stable public API
      publication waits for Platform S6.
  COMP-EVIDENCE-NONORPHAN:
    owners:
      - s1-premerge-content-addressed-conformance-gates
      - s1-custody-admission-semantic-preservation
      - s7-native-topology-conformance
    path: .megaplan/initiatives/megaplan-native-parity-corrective/chain.yaml
    locator: launch_preconditions custody M11 and bounded projection
    dependency_path: .megaplan/initiatives/custody-control-plane/chain.yaml
    rule: >-
      M11 completion/live authority, Custody, WBC, accepted-attempt, recovery,
      negative-fixture, and bounded-projection evidence is consumed by exact
      manifest/artifact identity. Supersession cannot delete, nominally replace,
      or orphan any evidence used by an existing manifest or gate.
  COMP-FALSE-PASS-GOLDEN:
    owners:
      - c1-completion-contract-identity-shadow
      - s5a-delivery-shadow-effect-class-proof
      - s5b-live-delivery-cutover-review-rework
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/c1-completion-contract-identity-shadow.md
    locator: Required work 10-12; C1 gate
    supporting_path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/s5a-delivery-shadow-effect-class-proof.md
    rule: >-
      At least one captured false-done/unroutable-REVIEW exemplar must be
      reproduced and rejected before C1 closes; S5A must reproduce it in the
      full shadow slice and S5B must consume that accepted proof before live
      cutover.
  COMP-REOPEN-NEW-ADMISSION:
    owners:
      - s5a-delivery-shadow-effect-class-proof
      - s5b-live-delivery-cutover-review-rework
    path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/s5a-delivery-shadow-effect-class-proof.md
    locator: Required work; GO-2 gate
    supporting_path: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/s5b-live-delivery-cutover-review-rework.md
    rule: >-
      Reopen is a new normal admission with a new attempt/generation binding
      that references the prior stable subject; it never mutates or rebinds the
      prior occurrence. Genuinely new work receives a new stable subject.
  COMP-LOW-BOILERPLATE-AUTHORING:
    owners:
      - c1-completion-contract-identity-shadow
      - s2b-pype-authoring-core
      - s3-developer-experience-tooling
    path: .megaplan/initiatives/native-workflow-platformization/briefs/s2b-pype-authoring-format-toolchain.md
    locator: Locked decisions; Required work; Gates
    supporting_path: .megaplan/initiatives/native-workflow-platformization/briefs/s3-developer-experience-tooling.md
    rule: >-
      Authors declare durable intent and domain obligations only through the
      canonical authoring surface. Deterministic tooling generates and pins
      bindings plus disposable worksheets/reports; admission and lints reject
      omissions. Pure helpers require no completion contract.
