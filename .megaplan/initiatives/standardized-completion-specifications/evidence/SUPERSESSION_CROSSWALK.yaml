global_invariants:
  custody_bounded_projection_owner: >-
    Custody owns the incremental/bounded incident projection implementation,
    full-rebuild parity, invalidation behavior, and 57k-scale benchmark
    receipt. Native requires and consumes that exact handoff.
  registry_separation: >-
    Completion candidate outcomes and Platform enforcement dispositions are
    distinct typed registries with a total generated reject-unknown-pairs
    boundary mapping. They are never collapsed into one enum.
  compatibility_boundary: >-
    C1 internally versions the persisted binding schema; C2 completes its
    reader/writer and decoder matrix; enforceable persisted-wire compatibility
    begins at accepted Native S2R GO-0. Stable public API publication remains
    Platform S6-only.
  shadow_only_c2: >-
    Historical Completion M2 language that described an authoritative nucleus
    is superseded. Active Native C2 is shadow-only and cannot alter admission,
    live acceptance, or kernel enablement; accepted Native S2R GO-0 is the sole
    live enablement.
  evidence_preservation: >-
    Preserve the exact accepted M11 manifest and live authority/Custody/WBC
    evidence, bounded-projection handoff, historical evidence, and every
    artifact consumed by an existing manifest or gate. Supersession must never
    orphan proof or replace content-addressed evidence by nominal identity.
