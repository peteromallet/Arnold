on_failure:
  retry: retry_milestone
  abort: stop_chain
on_escalate:
  abort: stop_chain
merge_policy: auto
prerequisite_policy: required
validation_policy: required
driver:
  auto_approve: true
  max_iterations: 90
  require_clean_base: true
  robustness: thorough
  poll_sleep: 8.0
