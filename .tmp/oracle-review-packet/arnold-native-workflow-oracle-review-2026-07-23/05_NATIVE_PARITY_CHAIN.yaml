base_branch: main
anchors:
  north_star: NORTHSTAR.md

launch_preconditions:
- name: pre-merge milestone conformance-gate bootstrap completed
  kind: chain_completed
  chain: .megaplan/initiatives/megaplan-chain-milestone-gates/chain.yaml
  require_manifest: true
- name: custody control plane M11 is completed with content-addressed proof
  kind: chain_completed
  chain: .megaplan/initiatives/custody-control-plane/chain.yaml
  require_manifest: true
- name: end-state report exists
  path: docs/arnold/megaplan-native-representation-report.md
  check:
    kind: contains_text
    text: Megaplan Native Python and Reusable Workflow Platform Representation Report
- name: golden source-to-runtime trace contract exists
  path: .megaplan/initiatives/megaplan-native-parity-corrective/GOLDEN_TRACE_CONTRACT.md
  check:
    kind: contains_text
    text: Native Megaplan golden source-to-runtime trace contract
- name: current codebase map exists
  path: docs/arnold/megaplan-native-current-codebase-map.md
  check:
    kind: contains_text
    text: Megaplan Native Parity Current Codebase Map
- name: oracle synthesis exists
  path: docs/arnold/megaplan-native-oracle-synthesis.md
  check:
    kind: contains_text
    text: Megaplan Native Parity Oracle Synthesis
- name: corrective plan exists
  path: docs/arnold/megaplan-native-parity-corrective-plan.md
  check:
    kind: contains_text
    text: Megaplan Native Parity Corrective Plan
- name: corrective initiative source is committed and clean
  kind: git_tracked
  path: .megaplan/initiatives/megaplan-native-parity-corrective
- name: corrective plan is committed and clean
  kind: git_tracked
  path: docs/arnold/megaplan-native-parity-corrective-plan.md

milestones:
- label: s1-custody-admission-semantic-preservation
  idea: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/s1-custody-admission-semantic-preservation.md
  profile: partnered-5
  robustness: extreme
  depth: max
  validate:
  - kind: conformance_gate
    validator: scripts/validate_megaplan_native_stage_gate.py
    conformance: docs/arnold/megaplan-native-parity-conformance.yaml
    traceability: docs/arnold/megaplan-native-parity-traceability.yaml
    proof_map: .megaplan/initiatives/megaplan-native-parity-corrective/s1-proof-map.json
  notes: Admit the exact M11 substrate, inventory and stage .pypeline-to-.pype migration without selecting it, freeze exact-one/private-step/shared-Python/identity semantics, and hand S2F a recoverable candidate plus negative corpus.
- label: s2f-pype-compiler-identity-converter
  idea: .megaplan/initiatives/megaplan-native-parity-corrective/briefs/s2f-pype-compiler-identity-converter.md
  profile: partnered-5
  robustness: extreme
  depth: max
  depends_on:
  - s1-custody-admission-semantic-preservation
  validate:
  - kind: conformance_gate
    validator: scripts/validate_pype_authoring_contract.py
    conformance: docs/arnold/pype-authoring-conformance.yaml
    traceability: docs/arnold/pype-authoring-traceability.yaml
    proof_map: .megaplan/initiatives/megaplan-native-parity-corrective/go-format-readiness-proof-map.json
  transition:
    kind: receipt_consuming_transition
    transition_id: arnold.megaplan.pype_authoring_cutover.v1
    handler: scripts/apply_megaplan_pype_authoring_cutover.py
    input_receipts:
    - current_validation
    output_receipt: .megaplan/initiatives/megaplan-native-parity-corrective/transition-s2f-pype-authoring-cutover.json
    verify:
      kind: conformance_gate
      validator: scripts/validate_pype_authoring_contract.py
      conformance: docs/arnold/pype-authoring-conformance.yaml
      traceability: docs/arnold/pype-authoring-traceability.yaml
      proof_map: .megaplan/initiatives/megaplan-native-parity-corrective/go-format-proof-map.json
  notes: Implement the exact-one .pype compiler/linker, identity/descriptor integration, converter, diagnostics and preview; after readiness validation, the typed transition selects .pype and a post-transition GO-FORMAT verifier must pass before runtime work.
