loop_plan             = "omp:grok/grok-4.6"
loop_execute          = "omp:grok/grok-4.6"
review                = "omp:grok/grok-4.6"
tiebreaker_researcher = "omp:grok/grok-4.6"
tiebreaker_challenger = "omp:grok/grok-4.6"

