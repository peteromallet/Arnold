# `partnered-5-grok` — partnered-5 with Grok (xAI) as the execution/reasoning
# vendor. Per the operator's model split: cheap DeepSeek tiers stay on omp
# for prep/gate/critique where applicable, but the codex:gpt-5.x slots (plan,
# revise, finalize, review, execute tiers 5-10, tiebreakers) move to
# omp:xai/grok-4.6. Requires XAI_API_KEY (console.x.ai) on the runtime.
[profiles.partnered-5-grok]
adaptive_critique = true
