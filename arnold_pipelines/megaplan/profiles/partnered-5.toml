# `partnered-5` — partnered-5 lineage with GPT-5.6-Sol routing per operator spec.
#
# Operator routing (2026-08-14):
#   execute tiers 1-6 -> DeepSeek Flash (cheap/fast)
#   execute tiers 7-8 -> DeepSeek Pro
#   execute tier  9   -> deepseek-v4-pro (floor) then codex:gpt-5.6-sol:medium
#   execute tier  10  -> deepseek-v4-pro (floor) then codex:gpt-5.6-sol:high
#   plan              -> deepseek-v4-pro (floor) then codex:gpt-5.6-sol:high
#   finalize          -> deepseek-v4-pro (floor) then codex:gpt-5.6-sol:high (same as plan)
#   revise            -> omp:deepseek/deepseek-v4-flash
#   review            -> deepseek-v4-pro (floor) then codex:gpt-5.6-sol:medium
#   critique_evaluator-> deepseek-v4-pro (floor) then codex:gpt-5.6-sol:high
#   prep / critique / gate -> DeepSeek Pro (unchanged from prior partnered-5)
#   feedback / loop_* / tiebreakers -> deepseek-v4-pro (floor) then gpt-5.6-sol (align with review)
#
# 2026-08-19 (astrid-first m6, occurrence fc98376b2f10): the OpenAI account
# backing codex exec has no credits, so every codex-routed phase now LEADS with
# omp:deepseek/deepseek-v4-pro (proven working) and keeps the operator's
# chosen codex:gpt-5.6-sol spec as the trailing slot for when credits return.
[profiles.partnered-5]
adaptive_critique = true
plan                  = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:high"]
prep                  = "omp:deepseek/deepseek-v4-pro"
critique              = "omp:deepseek/deepseek-v4-pro"
critique_evaluator    = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:high"]
revise                = "omp:deepseek/deepseek-v4-flash"
gate                  = "omp:deepseek/deepseek-v4-pro"
finalize              = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:high"]
execute               = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:high"]
feedback              = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:medium"]
loop_plan             = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:high"]
loop_execute          = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:medium"]
review                = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:medium"]
tiebreaker_researcher = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:high"]
tiebreaker_challenger = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:high"]

[profiles.partnered-5.tier_models.execute]
1 = "omp:deepseek/deepseek-v4-flash"
2 = "omp:deepseek/deepseek-v4-flash"
3 = "omp:deepseek/deepseek-v4-flash"
4 = "omp:deepseek/deepseek-v4-flash"
5 = "omp:deepseek/deepseek-v4-flash"
6 = "omp:deepseek/deepseek-v4-flash"
7 = "omp:deepseek/deepseek-v4-pro"
8 = "omp:deepseek/deepseek-v4-pro"
9 = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:medium"]
10 = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:high"]

[profiles.partnered-5.tier_models.critique]
1 = "omp:deepseek/deepseek-v4-flash"
2 = "omp:deepseek/deepseek-v4-pro"
3 = "omp:deepseek/deepseek-v4-pro"
4 = "omp:deepseek/deepseek-v4-pro"
5 = ["omp:deepseek/deepseek-v4-pro", "codex:gpt-5.6-sol:high"]
