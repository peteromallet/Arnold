#   execute tiers 1-6 -> DeepSeek Flash (cheap/fast)
#   execute tiers 7-8 -> DeepSeek Pro
#   execute tier  9   -> codex:gpt-5.6-sol:medium
#   execute tier  10  -> codex:gpt-5.6-sol:high
#   plan              -> codex:gpt-5.6-sol:high
#   finalize          -> codex:gpt-5.6-sol:high (same as plan)
#   revise            -> hermes:deepseek:deepseek-v4-flash
#   review            -> codex:gpt-5.6-sol:medium
#   critique_evaluator-> codex:gpt-5.6-sol:high
#   prep / critique / gate -> DeepSeek Pro (unchanged from prior partnered-5)
#   feedback / loop_* / tiebreakers -> gpt-5.6-sol (align with review)
