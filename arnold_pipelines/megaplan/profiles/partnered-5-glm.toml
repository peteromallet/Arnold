# `partnered-5-glm` is GLM-led and keeps every Execute route in the GLM
# family.  DeepSeek remains deliberately scoped to prep/critique/gate only.
# Finalization is deliberately pinned to GPT-5.6 Sol at high reasoning because
# it must compile the planning result into the exact execution contract.
# Finalize remains the sole Codex route.  Execute prefers direct Zhipu GLM
# 5.2, falls back to Fireworks GLM 5p2, then retries the direct route.
[profiles.partnered-5-glm]
adaptive_critique = true
plan                  = "hermes:zhipu:glm-5.2"
prep                  = "hermes:deepseek:deepseek-v4-pro"
critique              = "hermes:deepseek:deepseek-v4-pro"
critique_evaluator    = "hermes:zhipu:glm-5.2"
revise                = "hermes:zhipu:glm-5.2"
gate                  = "hermes:deepseek:deepseek-v4-pro"
finalize              = "codex:gpt-5.6-sol:high"
execute               = "hermes:zhipu:glm-5.2"
feedback              = "hermes:zhipu:glm-5.2"
loop_plan             = "hermes:zhipu:glm-5.2"
loop_execute          = "hermes:zhipu:glm-5.2"
review                = "hermes:zhipu:glm-5.2"
tiebreaker_researcher = "hermes:zhipu:glm-5.2"
tiebreaker_challenger = "hermes:zhipu:glm-5.2"

[profiles.partnered-5-glm.tier_models.execute]
1 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]
2 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]
3 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]
4 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]
5 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]
6 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]
7 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]
8 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]
9 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]
10 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]

[profiles.partnered-5-glm.tier_models.critique]
1 = "hermes:deepseek:deepseek-v4-flash"
2 = "hermes:deepseek:deepseek-v4-pro"
3 = "hermes:deepseek:deepseek-v4-pro"
4 = ["hermes:zhipu:glm-5.2", "hermes:fireworks:accounts/fireworks/models/glm-5p2", "hermes:zhipu:glm-5.2"]
5 = "hermes:zhipu:glm-5.2"
